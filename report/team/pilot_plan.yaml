# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu mỗi nhóm -> 42 người mỗi nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt)
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300 (dưới 20 cụm và không đủ mẫu)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt chỉ số chính, ngưỡng, luật dừng và ngày quyết định (2027-01-05) trước ngày bắt đầu pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm. Nhóm chọn chia theo nhân viên (20 + 20) để tách được tác động (đủ 20 cụm/nhóm, ít tràn tác động hơn chia theo yêu cầu) và chấp nhận nâng MDE từ 5 lên 6 điểm (n_per_arm = 859, m >= 299 yêu cầu/người, DE = 6,96). Nếu tác động thật chỉ là 5 điểm thì power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại: 4,25% toàn bộ (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982). Do đó không đặt ngưỡng tuyệt đối 3% mà đặt ngưỡng so với đối chứng (cao hơn >= 2 điểm) kèm trần tuyệt đối 6% và 0 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x); 40 nhân viên thuộc 12 depot"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên; mỗi bước một tuần; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (từ 0,05 lên 0,06)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng tuần, cùng depot với 20 nhân viên nhóm trợ lý; bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Trung bình: rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng phân quyền truy cập trợ lý theo tài khoản cá nhân và ghi log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng MDE 0,06, ba luật dừng, quy tắc kiểm tra giữa chừng và ngày quyết định 2027-01-05 chốt trước ngày bắt đầu"
  stop_rules:
    - "NẾU mở lại 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm hoặc vượt 6%, hoặc có >= 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút KHÔNG THÌ không được sang bước rollout tiếp"
    - "NẾU chi phí mỗi việc thành công > 8.000 đ TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày để tìm nguyên nhân KHÔNG THÌ không được chuyển bước rollout"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút trên 1.200 yêu cầu)"
    - "phut_lam_lai_simulated (1.132 phút trên 1.200 yêu cầu)"
    - "bảng giá giả định của lab (26 đ/1.000 token vào, 130 đ/1.000 token ra, 15 đ/lần gọi tool, 2.000 đ/phút nhân viên, 12.000 đ/yêu cầu baseline, 40 triệu đ/tháng chi phí cố định)"
