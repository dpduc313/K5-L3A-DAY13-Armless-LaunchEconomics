# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 yêu cầu mỗi nhóm -> 42 người mỗi nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt)
#   d) 6 depot mỗi nhóm: n hiệu dụng tối đa = 6 / 0,02 = 300 (dưới 20 cụm và không đủ mẫu)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu mỗi người (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong depot; giảm bằng phân quyền theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trước ngày bắt đầu pilot (2027-01-05).
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Với 40 nhân viên không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm. Nhóm chọn chia theo nhân viên (20 + 20) để tách được tác động (đủ 20 cụm/nhóm, ít tràn tác động hơn chia theo yêu cầu) và chấp nhận nâng MDE từ 5 lên 6 điểm (n_per_arm = 859, m >= 299 yêu cầu/người, DE = 6,96). Nếu tác động thật chỉ là 5 điểm thì power giảm còn khoảng 0,64.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại: 4,25% toàn bộ (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982). Do đó không đặt ngưỡng tuyệt đối 3% mà đặt ngưỡng so với đối chứng (cao hơn >= 2 điểm) kèm trần tuyệt đối 6% và 0 ca hoàn trùng.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại quoc_te (1,88x) và doi_tac (0,85x); 40 nhân viên thuộc 12 depot"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên; mỗi bước một tuần; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (từ 0,05 lên 0,06)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng chạy song song cùng tuần, cùng depot với 20 nhân viên nhóm trợ lý; bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot"
    spillover_risk: "Trung bình: rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng phân quyền truy cập trợ lý theo tài khoản cá nhân và ghi log lượt mở trợ lý theo staff_id"
    predeclared: "Có: chỉ số chính, ngưỡng MDE 0,06, bốn luật dừng, quy tắc kiểm tra giữa chừng và ngày quyết định 2027-01-05 chốt trước ngày bắt đầu"
  # ===== ĐỊNH NGHĨA DÙNG TRONG LUẬT DỪNG (đọc phần này trước) =====
  # Cách viết số: dấu phẩy là dấu thập phân (3,97% là ba phẩy chín mươi bảy phần trăm); dấu chấm ngăn hàng nghìn (8.000 đ là tám nghìn đồng).
  # Phạm vi: các yêu cầu hoàn phí có loai là noi_dia hoặc hang_nang. Yêu cầu loại khác không được tính vào bất kỳ con số nào dưới đây.
  # Nhóm dùng trợ lý: các yêu cầu trong phạm vi được chia ngẫu nhiên cho trợ lý xử lý trước.
  # Nhóm đối chứng: các yêu cầu trong phạm vi được chia ngẫu nhiên cho nhân viên tự làm từ đầu, không có trợ lý, trong cùng những ngày với nhóm dùng trợ lý.
  # Bậc rollout: phần trăm yêu cầu trong phạm vi được chia vào nhóm dùng trợ lý. Lần lượt 10%, 25%, 50%; mỗi bậc giữ ít nhất 1 tuần.
  # Tuần: tuần dương lịch, từ 00:00 thứ Hai đến 23:59 Chủ nhật. "2 tuần liên tiếp" nghĩa là hai tuần kề nhau, tuần nào cũng vượt ngưỡng.
  # Ngày làm việc: thứ Hai đến thứ Sáu, trừ ngày lễ.
  # Yêu cầu bị mở lại: yêu cầu đã đóng, sau đó được mở lại trong vòng 7 ngày kể từ lúc đóng (cột mo_lai_trong_7_ngay bằng 1).
  # Tỉ lệ mở lại của một nhóm, tính lúc 9:00 sáng ngày D: lấy mọi yêu cầu của nhóm đó đóng từ 00:00 ngày D trừ 14 đến 23:59 ngày D trừ 8. Mỗi yêu cầu này đã được theo dõi đủ 7 ngày. Tỉ lệ = số yêu cầu bị mở lại chia tổng số yêu cầu đó, nhân 100.
  # Điểm phần trăm: hiệu của hai tỉ lệ phần trăm, lấy tỉ lệ này trừ tỉ lệ kia. Ví dụ: đối chứng 4,0%, trợ lý 6,0%, chênh 2 điểm phần trăm. Không phải "cao hơn 2%" (4,0% cao hơn 2% là 4,08%).
  # Hoàn tiền trùng: cùng một khoản phí của cùng một yêu cầu được hoàn cho khách từ 2 lần trở lên.
  # Việc thành công: yêu cầu có ket_qua là thanh_cong (đã đóng, không bị mở lại trong 7 ngày, không sai tiền).
  # Chi phí biến đổi mỗi việc thành công của một tuần: (tiền token + tiền gọi tool + số phút xem lại nhân 2.000 đ + số phút làm lại nhân 2.000 đ) chia số việc thành công. Chỉ tính yêu cầu của nhóm dùng trợ lý đóng trong tuần đó, tính sau khi tuần đó đã qua đủ 7 ngày. Không cộng 40 triệu đ chi phí cố định mỗi tháng.
  # Được xem lại: một nhân viên đọc câu trả lời của trợ lý trước khi gửi khách và ghi một trong ba quyết định: giữ, sửa, bỏ.
  # Tỉ lệ xem lại: số yêu cầu được xem lại chia số yêu cầu của nhóm dùng trợ lý, nhân 100.
  # Tỉ lệ bỏ qua gợi ý của một tuần: số yêu cầu được xem lại có quyết định sửa hoặc bỏ, chia số yêu cầu được xem lại, nhân 100. Chỉ tính nhóm dùng trợ lý.
  # Thời gian xem lại trung bình của một tuần: tổng số phút xem lại chia số yêu cầu được xem lại. Phút xem lại đo từ lúc nhân viên mở câu trả lời đến lúc ghi quyết định. Chỉ tính nhóm dùng trợ lý.
  # Cờ tắt: công tắc trong hệ thống. Khi bật cờ tắt, trợ lý không nhận yêu cầu mới, mọi yêu cầu mới do nhân viên tự làm.
  # Người tính số: Kỹ sư trưởng agent tính tỉ lệ mở lại, tỉ lệ bỏ qua gợi ý, thời gian xem lại; Kế toán trưởng tính chi phí. Gửi số cho người có quyền dừng trước 9:30 sáng.
  # Số ghi "đợt chạy thử": đo trong 2 tuần chạy thử ở 6 depot, CÓ trợ lý, KHÔNG có nhóm đối chứng, chỉ tính trong phạm vi. Chỉ để tham khảo, không phải mức của nhân viên tự làm.
  #   Cách tính tay: mở lại 39/982 = 3,97%; chi phí mỗi việc thành công 3.414 đ (A4 trong bang_chi_phi.md); bỏ qua gợi ý 27 sửa hoặc bỏ / 128 yêu cầu được xem lại = 21,09%; xem lại 644 phút / 128 yêu cầu = 5,03 phút (simulated).
  stop_rules:
    - "NẾU một trong ba điều sau xảy ra: (a) tỉ lệ mở lại của nhóm dùng trợ lý trừ tỉ lệ mở lại của nhóm đối chứng lớn hơn hoặc bằng 2 điểm phần trăm; (b) tỉ lệ mở lại của nhóm dùng trợ lý lớn hơn hoặc bằng 6% (đợt chạy thử: 3,97%); (c) có 1 ca hoàn tiền trùng ở nhóm dùng trợ lý TRONG lần tính lúc 9:00 sáng mỗi ngày đối với (a) và (b), và bất kỳ lúc nào đối với (c) THÌ Giám đốc vận hành bật cờ tắt trong vòng 30 phút kể từ khi nhận số, và Kỹ sư trưởng agent đọc trace của từng yêu cầu bị mở lại hoặc hoàn tiền trùng rồi gửi kết luận cho Giám đốc vận hành trong vòng 24 giờ KHÔNG THÌ không ai được bật lại trợ lý hay tăng bậc rollout cho đến khi Giám đốc vận hành đồng ý bằng văn bản"
    - "NẾU chi phí biến đổi mỗi việc thành công lớn hơn 8.000 đ (đợt chạy thử: 3.414 đ, simulated) TRONG 2 tuần liên tiếp THÌ trong vòng 3 ngày làm việc kể từ khi Kế toán trưởng gửi số, PM trợ lý hoàn phí làm đủ ba việc: (a) giữ nguyên bậc rollout; (b) bỏ loại hang_nang khỏi phạm vi; (c) cho trợ lý chạy tối đa 2 lần mỗi yêu cầu, yêu cầu còn lỗi sau lần thứ 2 chuyển thẳng cho nhân viên KHÔNG THÌ không ai được tăng bậc rollout cho đến khi chi phí biến đổi mỗi việc thành công của 1 tuần trọn vẹn sau thay đổi nhỏ hơn hoặc bằng 8.000 đ"
    - "NẾU tỉ lệ bỏ qua gợi ý lớn hơn 40% (đợt chạy thử: 21,09%) TRONG 1 tuần THÌ PM trợ lý hoàn phí giữ nguyên bậc rollout, và Trưởng nhóm CSKH hỏi ít nhất 5 nhân viên của nhóm dùng trợ lý vì sao họ sửa hoặc bỏ gợi ý, rồi gửi danh sách lý do cho PM trợ lý hoàn phí trong vòng 3 ngày làm việc KHÔNG THÌ không ai được tăng bậc rollout cho đến khi tỉ lệ bỏ qua gợi ý của 1 tuần trọn vẹn nhỏ hơn hoặc bằng 40%"
    - "NẾU thời gian xem lại trung bình lớn hơn 6 phút, tức bằng thời gian nhân viên tự làm một yêu cầu (đợt chạy thử: 5,03 phút, simulated) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí giữ nguyên tỉ lệ xem lại, Trưởng nhóm CSKH rút ngắn mẫu xem lại trong vòng 5 ngày làm việc, và Kế toán trưởng tính lại chi phí biến đổi mỗi việc thành công của tuần kế tiếp KHÔNG THÌ không ai được tăng tỉ lệ xem lại cho đến khi thời gian xem lại trung bình của 1 tuần trọn vẹn nhỏ hơn hoặc bằng 6 phút"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated (890 phút trên 1.200 yêu cầu)"
    - "phut_lam_lai_simulated (1.132 phút trên 1.200 yêu cầu)"
    - "bảng giá giả định của lab (26 đ/1.000 token vào, 130 đ/1.000 token ra, 15 đ/lần gọi tool, 2.000 đ/phút nhân viên, 12.000 đ/yêu cầu baseline, 40 triệu đ/tháng chi phí cố định)"
